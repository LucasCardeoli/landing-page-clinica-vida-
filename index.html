<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida+</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header class="header">
        <nav id="navbar"> 
            <img class="logo" src="src/logo.png" alt="Logotipo Clínica Vida+">
        
            <ul id="nav_list">
                <li class="nav_item">
                    <a href="index.html" class="nav_link">Home</a>
                </li>
                <li class="nav_item">
                    <a href="#profissionais" class="nav_link">Profissionais</a>
                </li>
            </ul>

            <button class="btn-default">
                Agendar Horário
            </button>

            <button class="btn-mobile">
                Agendar Horário
            </button>
        </nav>

        <div id="mobile_menu">
            <ul id="nav_list">
                <li class="nav_item">
                    <a href="index.html" class="nav_link">Home</a>
                </li>
                <li class="nav_item">
                    <a href="#profissionais" class="nav_link">Profissionais</a>
                </li>
            </ul>

            <button class="btn-default">
                Agendar Horário
            </button>
        </div>
    </header>

    <main>
        <section id="home" class="hero" aria-label="Apresentação da Clínica Vida+"></section>

        <section id="profissionais" class="profissionais-grid">
        <article class="card-medico">
            <img src="src/MarianaCosta.jpg" alt="Dra. Mariana Costa">
            <h3>Dra. Mariana Costa</h3>
            <p>Clínica Geral & Cardiologia</p>
            <button type="button" class="btn-agendar" onclick="selecionarMedico('Dra. Mariana Costa')">Agendar com a Dra.</button>
        </article>

         <article class="card-medico">
            <img src="src/RobertoSantos.jpg" alt="Dr. Roberto Santos">
            <h3>Dr. Roberto Santos</h3>
            <p>Neurologia / Cardiologia</p>
            <button type="button" class="btn-agendar" onclick="selecionarMedico('Dr. Roberto Santos')">Agendar com o Dr.</button>
        </article>

         <article class="card-medico">
            <img src="src/LucasAlmeida.jpg" alt="Dr. Lucas Almeida">
            <h3>Dr. Lucas Almeida</h3>
            <p>Pediatria / Medicina da Família</p>
            <button type="button" class="btn-agendar" onclick="selecionarMedico('Dr. Lucas Almeida')">Agendar com o Dr.</button>
        </article>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
